<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 academy</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo-container">
            <span class="glitch">404</span>
            <span class="academy">Academy</span>
        </div>

        <ul class="nav-links">
            <ul class="nav-links">
                <li><a href="#home"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="courses.html"><i class="fas fa-book"></i> Courses</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
                <li><a id="logoutBtn" href="#logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>

        </ul>
    </nav>

    <!-- Main Content -->
    <main>
        <!-- Admin Section -->
        <div class="admin-page">
            <section id="admin-page">
                <form id="course-form">
                    <h2>Create a Course</h2>
                    <input type="text" id="course-title" placeholder="Course Title" required>
                    <textarea id="course-description" placeholder="Course Description" required></textarea>
                    <input type="text" id="course-price" placeholder="Price in INR" required>
                    <input type="text" id="course-duration" placeholder="Duration in Hours" required>
                    <input type="text" id="imageurl" placeholder="imageurl" required>
                    <input type="text" id="course-video" placeholder="YouTube Video URL" required>
                    <button type="submit">Create Course</button>
                </form>
                <div id="message"></div>
            </section>
            <br>
            <h2 id="admin-courses-title">Your Courses:</h2>
        </div>
        <!-- User Section -->
        <section id="user-page">
            <h1>Courses Enrolled:</h1>

        </section>

        <div id="videoModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <iframe id="videoFrame" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p class="tdm">404 academy ©2025. All Rights Reserved.</p>
    </footer>
    <script type="module" src="main.js"></script>
</body>

</html>
